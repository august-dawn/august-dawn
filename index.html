<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Օգոստոսյան Լուսաբաց</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #faf5d8;
            color: #3d2a20;
            font-family: Georgia, serif;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 7%;
            background:
                radial-gradient(
                    circle at 75% 25%,
                    #f1be68 0%,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #d07a51 0%,
                    #f1be68 55%,
                    #faf5d8 100%
                );
        }

        .container {
            width: min(1150px, 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 80px;
        }

        .info {
            flex: 1;
            max-width: 600px;
        }

        .label {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: #9d6c43;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(55px, 8vw, 105px);
            line-height: 0.88;
            font-weight: 400;
            color: #3d2a20;
            margin-bottom: 30px;
        }

        .author {
            font-size: 21px;
            color: #9d6c43;
            margin-bottom: 45px;
        }

        .read-button {
            display: inline-block;
            padding: 17px 34px;
            background: #9d6c43;
            color: #faf5d8;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            transition: 0.3s ease;
        }

        .read-button:hover {
            background: #3d2a20;
            transform: translateY(-3px);
        }

        .book {
            flex: 0 0 auto;
            width: min(360px, 38vw);
            filter: drop-shadow(
                20px 25px 30px rgba(61, 42, 32, 0.25)
            );
        }

        .book img {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 750px) {

            .hero {
                padding: 50px 25px;
            }

            .container {
                flex-direction: column-reverse;
                gap: 45px;
                text-align: center;
            }

            .book {
                width: min(280px, 70vw);
            }

            h1 {
                font-size: clamp(48px, 15vw, 75px);
            }

            .label {
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <main class="hero">

        <div class="container">

            <section class="info">

                <div class="label">
                    Էլեկտրոնային հրատարակություն · 2026
                </div>

                <h1>
                    Օգոստոսյան<br>
                    Լուսաբաց
                </h1>

                <div class="author">
                    Արեն Անանյան
                </div>

                <a href="reader.html" class="read-button">
                    ԿԱՐԴԱԼ →
                </a>

            </section>

            <section class="book">
                <img
                    src="cover.jpg"
                    alt="Օգոստոսյան Լուսաբաց գրքի շապիկը"
                >
            </section>

        </div>

    </main>

</body>
</html>
